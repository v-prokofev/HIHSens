# Automatically add ST scripts path from STM32CubeIDE 1.9.0
add_script_search_dir {C:/ST/STM32CubeIDE_1.9.0/STM32CubeIDE/plugins/com.st.stm32cube.ide.mcu.debug.openocd_2.0.200.202202161333/resources/openocd/st_scripts}

# ST-LINK DAP interface (supports clones, bypasses HLA recursion bug)
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# STM32F103 / CS32 / Clone CPUTAPID
set CPUTAPID 0x1ba01477
source [find target/stm32f1x.cfg]

reset_config none
adapter speed 1000
